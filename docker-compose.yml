services:
  db:
    image: postgres:16
    container_name: aura-postgres
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura
    ports:
      - "5432:5432"
    volumes:
      - aura_pg:/var/lib/postgresql/data

  api:
    build: .
    container_name: aura-api
    env_file:
      - .env
      - .env.docker
    ports:
      - "3333:3333"
    depends_on:
      - db

volumes:
  aura_pg: